name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track the toolchain declared in go.mod so CI cannot drift from local builds.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -race is the point of running tests in CI for this project: the upload path, the
      # garbage collector and the rate limiter all coordinate across goroutines, and those
      # are exactly the bugs that do not reproduce on a developer's machine.
      - name: Test
        run: go test -race -count=1 ./...

      # Builds each binary by explicit path. This is what catches a source directory that is
      # missing from the repository: `go build ./...` happily succeeds on a tree where an
      # entire cmd/ package was never committed, because there is nothing there to compile.
      # A .gitignore pattern once excluded cmd/api this way and the API went untracked.
      - name: Build binaries
        run: make build

  integration:
    name: Integration tests (real PostgreSQL)
    runs-on: ubuntu-latest

    # The unit suite mocks every repository, so it validates how services call the database
    # but never whether the SQL is valid. Two bugs got past it: a parameter PostgreSQL could
    # not type, and a UNIQUE constraint that never fired at the root because SQL treats NULLs
    # as distinct. Both are invisible without a real server.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nimbus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nimbus -d nimbus_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://nimbus:password@localhost:5432/nimbus_db?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Runs against a database built only from the migration files, so a migration that is
      # broken or out of order fails here rather than on a developer's already-migrated
      # database where it would never be re-applied.
      - name: Apply migrations
        run: make migrate DATABASE_URL="$TEST_DATABASE_URL"

      - name: Run integration tests
        run: make test-integration

      # Proves the down migrations are correct, which is otherwise never exercised: a
      # rollback is only ever run in an incident, which is the worst time to discover it
      # does not work.
      - name: Verify migrations roll back and re-apply
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@latest -dir migrations postgres "$TEST_DATABASE_URL" reset
          make migrate DATABASE_URL="$TEST_DATABASE_URL"

  verify-committed:
    name: Verify no source is excluded from the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A .gitignore pattern that matches a source path removes it from the repo silently:
      # everything keeps working locally, where the file is still on disk, and only a fresh
      # clone reveals it. Fail loudly instead.
      - name: Check .gitignore does not exclude tracked source
        run: |
          ignored="$(git ls-files --cached --ignored --exclude-standard)"
          if [ -n "$ignored" ]; then
            echo "These tracked files match a .gitignore rule:"
            echo "$ignored"
            exit 1
          fi

      - name: Check every Go source file on disk is tracked
        run: |
          untracked="$(git ls-files --others --exclude-standard -- '*.go')"
          if [ -n "$untracked" ]; then
            echo "These Go files exist but are not tracked by git:"
            echo "$untracked"
            echo "They will be missing from a fresh clone. Commit them, or narrow the"
            echo ".gitignore rule that is hiding them."
            exit 1
          fi

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
